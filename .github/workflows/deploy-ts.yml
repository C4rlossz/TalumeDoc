name: Deploy AWS
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: talumedoc-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: develop
    env:
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_NAME: ${{ vars.AWS_ROLE_NAME }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment configuration
        shell: bash
        run: |
          test -n "$AWS_ACCOUNT_ID" && test -n "$AWS_REGION" && test -n "$AWS_ROLE_NAME"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: dotnet restore TalumeDoc.sln --locked-mode
      - run: dotnet test TalumeDoc.sln --no-restore -c Release
      - run: npm ci
      - run: npm run build
      - run: npm test -- --runInBand
      - run: bash scripts/publish.sh
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/${{ vars.AWS_ROLE_NAME }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - run: npx cdk synth
      - name: Deploy reviewed infrastructure
        env:
          REPOSITORY_NAME: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: npx cdk deploy TalumeDoc --require-approval never --outputs-file cdk-outputs.json -c "repoName=$REPOSITORY_NAME" -c "gitCommit=$COMMIT_SHA"
      - uses: actions/upload-artifact@v7
        with:
          name: deployment-outputs
          path: cdk-outputs.json
